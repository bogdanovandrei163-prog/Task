<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Заметки">
<meta name="theme-color" content="#3498db">
<title>Заметки и События</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    max-width: 700px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 { margin-bottom: 20px; color: #2c3e50; font-size: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1;
    padding: 12px 20px; border: none; border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 15px;
    transition: 0.2s; font-weight: 500;
  }
  .tab.active { background: #3498db; color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  .form { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 20px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  input, textarea, button {
    width: 100%; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
    font-family: inherit; -webkit-appearance: none;
  }
  textarea { resize: vertical; min-height: 70px; }
  .btn {
    background: #3498db; color: #fff; border: none; cursor: pointer;
    font-weight: 600; transition: 0.2s; padding: 14px;
  }
  .btn:active { background: #2980b9; transform: scale(0.98); }
  .btn-danger { background: #e74c3c; padding: 8px 12px; width: auto; margin: 0; font-size: 13px; }
  .btn-danger:active { background: #c0392b; }
  .item {
    background: #fff; padding: 14px 16px; border-radius: 10px;
    margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .item-content { flex: 1; word-break: break-word; }
  .item-title { font-weight: 600; margin-bottom: 4px; font-size: 16px; }
  .item-text { color: #555; font-size: 14px; white-space: pre-wrap; }
  .item-date { color: #888; font-size: 13px; margin-top: 6px; }
  .empty { text-align: center; color: #999; padding: 30px; font-style: italic; }
  .notif-warn {
    background: #fff3cd; border: 1px solid #ffeeba; color: #856404;
    padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;
  }
  .notif-warn button {
    width: auto; padding: 6px 12px; margin: 8px 0 0; display: inline-block;
    background: #856404; color: #fff; font-size: 13px; border-radius: 6px;
  }
</style>
</head>
<body>

<h1>📝 Заметки и События</h1>

<div id="notifWarn" class="notif-warn" style="display:none">
  ⚠️ Уведомления не разрешены.<br>
  <button id="allowNotif">Разрешить уведомления</button>
</div>

<div class="tabs">
  <button class="tab active" data-tab="notes">📝 Заметки</button>
  <button class="tab" data-tab="events">📅 События</button>
</div>

<!-- Заметки -->
<div id="notes" class="panel active">
  <div class="form">
    <input id="noteTitle" placeholder="Заголовок заметки">
    <textarea id="noteText" placeholder="Текст заметки"></textarea>
    <button class="btn" onclick="addNote()">Добавить заметку</button>
  </div>
  <div id="notesList"></div>
</div>

<!-- События -->
<div id="events" class="panel">
  <div class="form">
    <input id="eventTitle" placeholder="Название события">
    <textarea id="eventDesc" placeholder="Описание (необязательно)"></textarea>
    <input id="eventDate" type="datetime-local">
    <button class="btn" onclick="addEvent()">Создать событие</button>
  </div>
  <div id="eventsList"></div>
</div>

<script>
// ===== Проверка разрешений на уведомления =====
function checkNotifPermission() {
  if (!('Notification' in window)) {
    document.getElementById('notifWarn').style.display = 'block';
    document.getElementById('notifWarn').innerHTML = '❌ Этот браузер не поддерживает уведомления.';
    return;
  }
  if (Notification.permission === 'default') {
    document.getElementById('notifWarn').style.display = 'block';
  } else if (Notification.permission === 'denied') {
    document.getElementById('notifWarn').style.display = 'block';
    document.getElementById('notifWarn').innerHTML = '❌ Уведомления запрещены. Разреши их в Настройках iPhone → Уведомления.';
  } else {
    document.getElementById('notifWarn').style.display = 'none';
  }
}

document.getElementById('allowNotif').onclick = async () => {
  try {
    await Notification.requestPermission();
  } catch (e) { console.warn(e); }
  checkNotifPermission();
};

// ===== Отправка уведомления =====
async function sendNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body: body || '',
        icon: 'icon-192.png',
        badge: 'icon-192.png'
      });
    } else {
      new Notification(title, { body: body || '' });
    }
  } catch (e) {
    console.warn('Notification error:', e);
    try { new Notification(title, { body: body || '' }); } catch(_) {}
  }
}

// ===== Хранилище =====
const LS_NOTES = 'app_notes';
const LS_EVENTS = 'app_events';
const LS_FIRED = 'app_fired_events';

function load(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let notes = load(LS_NOTES);
let events = load(LS_EVENTS);
let fired = load(LS_FIRED);

// ===== Табы =====
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  };
});

// ===== Заметки =====
function addNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const text = document.getElementById('noteText').value.trim();
  if (!title && !text) return;
  notes.unshift({ id: Date.now(), title, text, created: new Date().toISOString() });
  save(LS_NOTES, notes);
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteText').value = '';
  renderNotes();
}

function deleteNote(id) {
  if (!confirm('Удалить заметку?')) return;
  notes = notes.filter(n => n.id !== id);
  save(LS_NOTES, notes);
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById('notesList');
  if (!notes.length) { list.innerHTML = '<div class="empty">Пока нет заметок</div>'; return; }
  list.innerHTML = notes.map(n => `
    <div class="item">
      <div class="item-content">
        <div class="item-title">${escapeHtml(n.title) || '(без заголовка)'}</div>
        ${n.text ? `<div class="item-text">${escapeHtml(n.text)}</div>` : ''}
        <div class="item-date">${new Date(n.created).toLocaleString('ru-RU')}</div>
      </div>
      <button class="btn btn-danger" onclick="deleteNote(${n.id})">✕</button>
    </div>
  `).join('');
}

// ===== События =====
function addEvent() {
  const title = document.getElementById('eventTitle').value.trim();
  const desc = document.getElementById('eventDesc').value.trim();
  const dateStr = document.getElementById('eventDate').value;
  if (!title || !dateStr) { alert('Укажи название и дату события'); return; }
  const date = new Date(dateStr).getTime();
  if (isNaN(date)) { alert('Неверная дата'); return; }
  if (date <= Date.now()) { alert('Дата должна быть в будущем'); return; }
  events.push({ id: Date.now(), title, desc, date });
  events.sort((a, b) => a.date - b.date);
  save(LS_EVENTS, events);
  document.getElementById('eventTitle').value = '';
  document.getElementById('eventDesc').value = '';
  document.getElementById('eventDate').value = '';
  renderEvents();
}

function deleteEvent(id) {
  if (!confirm('Удалить событие?')) return;
  events = events.filter(e => e.id !== id);
  fired = fired.filter(f => f !== id);
  save(LS_EVENTS, events);
  save(LS_FIRED, fired);
  renderEvents();
}

function renderEvents() {
  const list = document.getElementById('eventsList');
  if (!events.length) { list.innerHTML = '<div class="empty">Пока нет событий</div>'; return; }
  list.innerHTML = events.map(e => {
    const d = new Date(e.date);
    const isPast = e.date < Date.now();
    return `
      <div class="item">
        <div class="item-content">
          <div class="item-title">${escapeHtml(e.title)}</div>
          ${e.desc ? `<div class="item-text">${escapeHtml(e.desc)}</div>` : ''}
          <div class="item-date">🕐 ${d.toLocaleString('ru-RU')} ${isPast ? '(прошло)' : ''}</div>
        </div>
        <button class="btn btn-danger" onclick="deleteEvent(${e.id})">✕</button>
      </div>
    `;
  }).join('');
}

// ===== Проверка событий =====
function checkEvents() {
  const now = Date.now();
  let changed = false;
  events.forEach(ev => {
    if (ev.date <= now && !fired.includes(ev.id)) {
      sendNotification('🔔 ' + ev.title, ev.desc || 'Событие наступило');
      fired.push(ev.id);
      changed = true;
    }
  });
  if (changed) save(LS_FIRED, fired);
}

setInterval(checkEvents, 15000);

// ===== Утилиты =====
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// ===== Регистрация Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error:', err));
  });
}

// ===== Инициализация =====
renderNotes();
renderEvents();
checkNotifPermission();
checkEvents();
</script>
</body>
</html>
